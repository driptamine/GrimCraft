name: Deploy Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No test step: ~32 tests assert on models/ on disk, which is gitignored
      # (1.1 GB, hosted on R2). Tests stay a local gate: npm test -- --runInBand.
      - run: npm run build
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      # The Netlify CLI also runs the site's build command from the app
      # settings, so it needs the R2 base too — otherwise it would rebuild
      # dist/ without models and deploy that instead.
      - run: npx --yes netlify-cli deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
