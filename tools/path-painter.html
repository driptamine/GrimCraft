<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Alvarus path painter — отметь проход, скопируй координаты</title>
<script src="alvarus-grid-data.js"></script>
<style>
  body { margin:0; background:#0b1118; color:#cfe3f5; font-family:monospace; display:flex; height:100vh; }
  #wrap { flex:1; position:relative; overflow:hidden; }
  canvas { position:absolute; inset:0; cursor:crosshair; }
  #side { width:300px; border-left:1px solid #244; padding:10px; overflow-y:auto; font-size:12px; }
  #side h3 { margin:6px 0; font-size:13px; }
  .row { margin:8px 0; }
  button { font-family:inherit; font-size:12px; margin:2px; padding:5px 10px; cursor:pointer;
    background:#12202e; color:#cfe3f5; border:1px solid #3a6a8a; }
  button.on { background:#1f5a7a; color:#fff; }
  #readout { background:#0e1822; border:1px solid #244; padding:6px; min-height:64px; white-space:pre-wrap; }
  #export { width:100%; height:150px; font-family:inherit; font-size:11px; background:#0e1822; color:#9fe8a8; border:1px solid #244; }
  .hint { color:#7fa3bd; font-size:11px; }
  b.r { color:#ff7a7a; } b.y { color:#ffd76a; } b.g { color:#9fe8a8; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="side">
  <h3>Краска проходимости</h3>
  <div class="row" id="vals">
    <button data-v="2" class="on"><b class="g">2</b> свободно</button>
    <button data-v="3"><b class="y">3</b> бахрома</button>
    <button data-v="7"><b class="r">7</b> закрыто</button>
  </div>
  <div class="row" id="brushes">Кисть:
    <button data-b="0" class="on">1</button><button data-b="1">3×3</button><button data-b="2">5×5</button>
  </div>
  <div class="row">
    <button id="reset">Сбросить мои правки</button>
    <button id="copy">Копировать координаты</button>
    <button id="dl">Скачать .json</button>
  </div>
  <div class="row hint">Рисуй левой кнопкой. Колесо — зум, правая кнопка / Shift+тяга — сдвиг. <b>R</b> — реликвии. Изменённых клеток: <span id="nchanged">0</span></div>
  <div class="row"><div id="readout">наведи на карту</div></div>
  <div class="row"><textarea id="export" readonly placeholder="тут появятся координаты для меня"></textarea></div>
</div>
<script>
(function () {
  var D = window.ALVARUS_GRID;
  var N = D.grid.sizeX, CELL = D.grid.cellWorld, OX = D.grid.originX, OZ = D.grid.originZ;
  var paint = D.paint.map(function (row) { return row.slice(); });
  var base = D.paint.map(function (row) { return row.slice(); });
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var wrap = document.getElementById('wrap');
  var scale = 2, ox = 40, oy = 20;
  var val = 2, brush = 0, painting = false, panning = false;
  var hover = null;

  function resize() { cv.width = wrap.clientWidth; cv.height = wrap.clientHeight; draw(); }
  window.addEventListener('resize', resize);

  var hmin = 1e9, hmax = -1e9, i;
  for (i = 0; i < D.heights.length; i++) {
    if (D.heights[i] < hmin) hmin = D.heights[i];
    if (D.heights[i] > hmax) hmax = D.heights[i];
  }
  function hcolor(h) {
    var t = (h - hmin) / (hmax - hmin || 1);
    var r = Math.round(20 + t * 150), g = Math.round(40 + t * 110), b = Math.round(24 + t * 40);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function cellXY(c, r) { return [OX + (c + 0.5) * CELL, OZ + (r + 0.5) * CELL]; }
  // View is rotated 180° to match the in-game minimap: data cell (c,r) shows
  // at display slot (N-1-c, N-1-r). Export still reports true data c/r.
  function DX(c) { return ox + (N - 1 - c) * scale; }
  function DY(r) { return oy + (N - 1 - r) * scale; }
  function toCell(mx, my) {
    var c = N - 1 - Math.floor((mx - ox) / scale), r = N - 1 - Math.floor((my - oy) / scale);
    if (c < 0 || r < 0 || c >= N || r >= N) return null;
    return { c: c, r: r };
  }

  function draw() {
    ctx.fillStyle = '#0b1118';
    ctx.fillRect(0, 0, cv.width, cv.height);
    var k0x = Math.floor((0 - ox) / scale) - 1, k1x = Math.ceil((cv.width - ox) / scale) + 1;
    var k0y = Math.floor((0 - oy) / scale) - 1, k1y = Math.ceil((cv.height - oy) / scale) + 1;
    var c0 = Math.max(0, N - 1 - k1x), c1 = Math.min(N, N - k0x);
    var r0 = Math.max(0, N - 1 - k1y), r1 = Math.min(N, N - k0y);
    var c, r, x, y, k;
    for (r = r0; r < r1; r++) for (c = c0; c < c1; c++) {
      x = DX(c); y = DY(r);
      ctx.fillStyle = hcolor(D.heights[r * N + c]);
      ctx.fillRect(x, y, scale + 0.5, scale + 0.5);
      var p = paint[r][c];
      if (p === 7) { ctx.fillStyle = 'rgba(255,60,60,0.55)'; ctx.fillRect(x, y, scale + 0.5, scale + 0.5); }
      else if (p === 3) { ctx.fillStyle = 'rgba(255,200,60,0.45)'; ctx.fillRect(x, y, scale + 0.5, scale + 0.5); }
      else if (p !== 2) { ctx.fillStyle = 'rgba(160,160,160,0.5)'; ctx.fillRect(x, y, scale + 0.5, scale + 0.5); }
      if (base[r][c] !== paint[r][c]) {
        ctx.strokeStyle = '#54e0ff'; ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, scale - 1, scale - 1);
      }
    }
    // grid lines every 16 cells + world coords
    ctx.strokeStyle = 'rgba(120,180,220,0.18)'; ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(160,210,240,0.8)'; ctx.font = '10px monospace';
    for (k = 0; k <= N; k += 16) {
      x = ox + k * scale;
      ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + N * scale); ctx.stroke();
      ctx.fillText(String(OX + (N - k) * CELL), x + 2, 12);
    }
    for (k = 0; k <= N; k += 16) {
      y = oy + k * scale;
      ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + N * scale, y); ctx.stroke();
      ctx.fillText(String(OZ + (N - k) * CELL), 2, y - 2);
    }
    // relics
    D.relics.forEach(function (rc) {
      var cc = Math.floor((rc.x - OX) / CELL), rr = Math.floor((rc.z - OZ) / CELL);
      x = ox + (N - cc - 0.5) * scale; y = oy + (N - rr - 0.5) * scale;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, Math.max(6, scale * 1.5), 0, 7); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace';
      ctx.fillText('R', x - 4, y + 4);
    });
    if (hover) {
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(DX(hover.c), DY(hover.r), scale, scale);
    }
  }

  function showAt(cell) {
    var el = document.getElementById('readout');
    if (!cell) { el.textContent = 'наведи на карту'; return; }
    var xy = cellXY(cell.c, cell.r);
    el.textContent = 'мир x=' + xy[0].toFixed(0) + ' z=' + xy[1].toFixed(0) +
      '  клетка c=' + cell.c + ' r=' + cell.r +
      '\nвысота ' + D.heights[cell.r * N + cell.c].toFixed(1) +
      '  краска ' + paint[cell.r][cell.c] + (base[cell.r][cell.c] !== paint[cell.r][cell.c] ? ' (было ' + base[cell.r][cell.c] + ')' : '');
  }

  function dab(cell) {
    for (var dr = -brush; dr <= brush; dr++) for (var dc = -brush; dc <= brush; dc++) {
      var c = cell.c + dc, r = cell.r + dr;
      if (c >= 0 && r >= 0 && c < N && r < N) paint[r][c] = val;
    }
    refreshExport();
    draw();
  }

  function pos(e) {
    var b = cv.getBoundingClientRect();
    return [e.clientX - b.left, e.clientY - b.top];
  }
  cv.addEventListener('mousedown', function (e) {
    var m = pos(e);
    if (e.button === 2 || e.button === 1 || e.shiftKey) { panning = true; cv.style.cursor = 'move'; }
    else { painting = true; var cell = toCell(m[0], m[1]); if (cell) dab(cell); }
    cv._px = m[0]; cv._py = m[1];
    e.preventDefault();
  });
  cv.addEventListener('mousemove', function (e) {
    var m = pos(e);
    if (panning) { ox += m[0] - cv._px; oy += m[1] - cv._py; cv._px = m[0]; cv._py = m[1]; draw(); return; }
    var cell = toCell(m[0], m[1]);
    hover = cell;
    if (painting && cell) dab(cell);
    showAt(cell);
    draw();
  });
  window.addEventListener('mouseup', function () { painting = false; panning = false; cv.style.cursor = 'crosshair'; });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  cv.addEventListener('wheel', function (e) {
    var m = pos(e), k = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    var ns = Math.min(96, Math.max(1, scale * k));
    ox = m[0] - (m[0] - ox) * (ns / scale);
    oy = m[1] - (m[1] - oy) * (ns / scale);
    scale = ns;
    draw();
    e.preventDefault();
  }, { passive: false });

  function selBtns(id, attr, fn) {
    document.getElementById(id).querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        document.getElementById(id).querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        fn(Number(b.dataset[attr]));
      });
    });
  }
  selBtns('vals', 'v', function (v) { val = v; });
  selBtns('brushes', 'b', function (b) { brush = b; });

  function collect() {
    var out = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      if (paint[r][c] !== base[r][c]) {
        var xy = cellXY(c, r);
        out.push({ x: Math.round(xy[0] * 10) / 10, z: Math.round(xy[1] * 10) / 10, v: paint[r][c], c: c, r: r });
      }
    }
    return out;
  }
  function refreshExport() {
    var edits = collect();
    document.getElementById('nchanged').textContent = String(edits.length);
    document.getElementById('export').value = edits.length
      ? 'PATHFINDING EDITS alvarus (' + edits.length + ' cells)\n' + JSON.stringify({ edits: edits })
      : '';
  }
  document.getElementById('reset').addEventListener('click', function () {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) paint[r][c] = base[r][c];
    refreshExport();
    draw();
  });
  document.getElementById('copy').addEventListener('click', function () {
    refreshExport();
    var t = document.getElementById('export');
    t.select();
    try { document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard && t.value) navigator.clipboard.writeText(t.value);
  });
  document.getElementById('dl').addEventListener('click', function () {
    refreshExport();
    var blob = new Blob([document.getElementById('export').value], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'alvarus-path-edits.json';
    a.click();
  });

  // center on the game relic (66,-68) hill at start (rotated view)
  (function () {
    resize();
    scale = 4;
    var cc = Math.floor((66 - OX) / CELL), rr = Math.floor((-68 - OZ) / CELL);
    ox = cv.width / 2 - (N - cc - 0.5) * scale;
    oy = cv.height / 2 - (N - rr - 0.5) * scale;
    draw();
  })();
})();
</script>
</body>
</html>
